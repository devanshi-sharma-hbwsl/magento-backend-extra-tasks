<!-- app/code/Vendor2/Textfield/view/frontend/web/template/custom-text-area.html -->
<div class="control">
    <label class="label" for="custom-text-area">
        <span>Custom Message</span>
    </label>
    <textarea id="custom-text-area"
              class="input-text"
              data-bind="textInput: customText,
                         event: {'change': updateFormData, 'blur': updateFormData}"
              rows="4"
              cols="50"></textarea>
</div>

<!-- Add this hidden trigger -->
<div data-bind="visible: false, event: { mouseover: updateFormData }"></div>
